name: Update 52-Week Returns

on:
  schedule:
    # Every Saturday at 05:22 UTC
    - cron: '22 5 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write

# Jobs committing data/ run one at a time, so their cache commits never conflict
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # The tip of main, not the triggering commit: a run queued behind another
      # job picks up the caches that job just committed
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update 52-week returns
        run: python stocks-52w.py

      # The report together with the refreshed caches
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks-52w.md data/
          git diff --cached --quiet && exit 0
          git commit -m "Update 52-week returns"
          git pull --rebase
          git push
