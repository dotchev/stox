name: Update Folio

on:
  workflow_dispatch: {}

permissions:
  contents: write

# Jobs committing data/ run one at a time, so their cache commits never conflict
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The tip of main, not the triggering commit: a run queued behind another
      # job picks up the caches that job just committed
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # folio.py checks its own output (columns, skipped symbols, prices) and
      # exits non-zero before writing data/folio.csv if it looks broken
      - name: Run folio
        run: python folio.py

      # folio.csv together with the refreshed caches. The sheet update checks
      # this commit's time for freshness.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update folio"
          git pull --rebase
          git push
