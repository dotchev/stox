name: Update Folio

on:
  schedule:
    # Saturday 05:13 UTC
    - cron: '13 5 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write

# Jobs committing data/ run one at a time, so their cache commits never conflict
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The tip of main, not the triggering commit: a run queued behind another
      # job picks up the caches that job just committed
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run folio
        run: python folio.py

      - name: Sanity-check folio.csv
        run: |
          python - <<'EOF'
          import csv, sys
          rows = list(csv.reader(open('data/folio.csv')))
          header = ['symbol', 'name', 'price', 'weeks', 'gmean', 'std', 'sharpe', 'range', 'revenue', 'T200']
          if rows[0] != header:
              sys.exit(f'unexpected header: {rows[0]}')
          data = rows[1:]
          if len(data) < 50:
              sys.exit(f'only {len(data)} rows')
          bad = [r[0] for r in data if not r[2] or float(r[2]) <= 0]
          if bad:
              sys.exit(f'missing or non-positive prices: {bad}')
          print(f'folio.csv OK: {len(data)} rows')
          EOF

      # folio.csv together with the refreshed caches. The sheet update checks
      # this commit's time for freshness.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update folio"
          git pull --rebase
          git push
